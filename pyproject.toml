
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-event-log-analyzer"
version = "0.1.0"
description = "A Python-based Windows Security Event Log analyzer for suspicious authentication activity."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pywin32"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[project.scripts]
windows-event-log-analyzer = "event_analyzer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
